name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/RequestTask.Api.Tests/RequestTask.Api.Tests.csproj

      - name: Build backend and tests
        run: dotnet build backend/RequestTask.Api.Tests/RequestTask.Api.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test backend/RequestTask.Api.Tests/RequestTask.Api.Tests.csproj --configuration Release --no-build
